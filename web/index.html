<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Flynoom — Book Hotels &amp; Flights</title>
  <meta name="description" content="Book hotels and flights worldwide at great prices with Flynoom. احجز فندقك ورحلتك بسهولة.">
  <meta name="theme-color" content="#0D47A1">
  <link rel="canonical" href="https://flynoom.com/">

  <!-- Open Graph: link previews on Facebook, WhatsApp, LinkedIn, iMessage -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Flynoom">
  <meta property="og:url" content="https://flynoom.com/">
  <meta property="og:title" content="Flynoom — Book Hotels &amp; Flights">
  <meta property="og:description" content="Book hotels and flights worldwide at great prices. احجز فندقك ورحلتك بسهولة.">
  <meta property="og:image" content="https://flynoom.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Flynoom logo">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="ar_AR">

  <!-- X (Twitter) card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Flynoom — Book Hotels &amp; Flights">
  <meta name="twitter:description" content="Book hotels and flights worldwide at great prices.">
  <meta name="twitter:image" content="https://flynoom.com/og-image.png">

  <!-- Official social profiles -->
  <link rel="me" href="https://www.facebook.com/flynoom.booking">
  <link rel="me" href="https://www.instagram.com/flynoom.booking">
  <link rel="me" href="https://www.tiktok.com/@flynoom">
  <link rel="me" href="https://www.youtube.com/channel/UCfa_VHdzyOsXlKmj4-w5VQg">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flynoom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <!-- Organization info for Google (logo + social profiles in search results) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Flynoom",
    "url": "https://flynoom.com/",
    "logo": "https://flynoom.com/icons/Icon-512.png",
    "email": "support@flynoom.com",
    "sameAs": [
      "https://www.facebook.com/flynoom.booking",
      "https://www.instagram.com/flynoom.booking",
      "https://www.tiktok.com/@flynoom",
      "https://www.youtube.com/channel/UCfa_VHdzyOsXlKmj4-w5VQg"
    ]
  }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
